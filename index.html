<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinflip পার্টনার ও বেটিং সিস্টেম</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 22px;
        }
        .balance-card {
            background: #f8f9fa;
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .balance-card span {
            color: #27ae60;
        }
        .coin-box {
            perspective: 1000px;
            margin: 20px auto;
            width: 100px;
            height: 100px;
        }
        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s ease-in-out;
        }
        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.1);
        }
        .heads {
            background: #f1c40f;
            border: 4px solid #d4ac0d;
            color: #fff;
        }
        .tails {
            background: #e67e22;
            border: 4px solid #d35400;
            color: #fff;
            transform: rotateY(180deg);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #27ae60; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-blue { background: #3498db; }
        .btn-blue:hover { background: #2980b9; }
        .btn-red { background: #e74c3c; }
        .btn-red:hover { background: #c0392b; }
        
        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
        
        /* Transaction Section */
        .tx-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        /* Animation Classes */
        .flip-heads { animation: flipH 1.2s forwards; }
        .flip-tails { animation: flipT 1.2s forwards; }
        @keyframes flipH { 0% { transform: rotateY(0); } 100% { transform: rotateY(1440deg); } }
        @keyframes flipT { 0% { transform: rotateY(0); } 100% { transform: rotateY(1620deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🪙 Coinflip পার্টনার বেটিং</h1>
        
        <div class="balance-card">
            বর্তমান ব্যালেন্স: <span id="user-balance">৫০০</span> ৳
        </div>
        
        <div class="coin-box">
            <div class="coin" id="coin">
                <div class="side heads">H</div>
                <div class="side tails">T</div>
            </div>
        </div>

        <div class="form-group">
