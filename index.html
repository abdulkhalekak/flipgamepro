<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কয়েন টস গেম (Coinflip)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            color: #4a4a4a;
            font-size: 24px;
        }
        .coin-box {
            perspective: 1000px;
            margin: 30px auto;
            width: 120px;
            height: 120px;
        }
        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s ease-in-out;
        }
        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.1);
        }
        .heads {
            background: #f1c40f;
            border: 5px solid #d4ac0d;
            color: #7f8c8d;
        }
        .tails {
            background: #e67e22;
            border: 5px solid #d35400;
            color: #fff;
            transform: rotateY(180deg);
        }
        button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
            width: 100%;
        }
        button:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            min-height: 28px;
        }
        /* অ্যানিমেশন ক্লাস */
        .flip-heads {
            animation: flipH 1.5s forwards;
        }
        .flip-tails {
            animation: flipT 1.5s forwards;
        }
        @keyframes flipH {
            0% { transform: rotateY(0); }
            100% { transform: rotateY(1800deg); } /* ৫ বার ঘুরবে */
        }
        @keyframes flipT {
            0% { transform: rotateY(0); }
            100% { transform: rotateY(1980deg); } /* ৫.৫ বার ঘুরবে */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🪙 Coinflip গেম</h1>
        
        <div class="coin-box">
            <div class="coin" id="coin">
                <div class="side heads">H</div>
                <div class="side tails">T</div>
            </div>
        </div>

        <button onclick="flipCoin()">টস করুন</button>
        <div id="result"></div>
    </div>

    <script>
        function flipCoin() {
            const coin = document.getElementById('coin');
            const resultText = document.getElementById('result');
            const button = document.querySelector('button');
            
            // বাটন সাময়িক নিষ্ক্রিয় করা এবং পূর্বের টেক্সট মোছা
            button.disabled = true;
            resultText.innerText = "কয়েন ঘুরছে...";
            
            // আগের অ্যানিমেশন রিসেট করা
            coin.className = 'coin';
            
            // র্যান্ডম ফলাফল (0 = Heads, 1 = Tails)
            const isHeads = Math.random() < 0.5;
            
            // অ্যানিমেশন শুরু (সামান্য সময় পর যাতে ব্রাউজার রি-রেন্ডার করতে পারে)
            setTimeout(() => {
                if(isHeads) {
                    coin.classList.add('flip-heads');
                } else {
                    coin.classList.add('flip-tails');
                }
            }, 50);

            // অ্যানিমেশন শেষ হওয়ার পর ফলাফল দেখানো (১.৫ সেকেন্ড পর)
            setTimeout(() => {
                if(isHeads) {
                    resultText.innerHTML = "<span style='color: #d4ac0d;'>🎉 Heads (মাথা) এসেছে!</span>";
                } else {
                    resultText.innerHTML = "<span style='color: #d35400;'>🎉 Tails (লেজ) এসেছে!</span>";
                }
                button.disabled = false;
            }, 1550);
        }
    </script>
</body>
</html>
